name: Build ReelClone AI APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Accept Android SDK Licenses & Install Packages
        shell: bash
        run: |
          set +o pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name "sdkmanager" -type f | head -n 1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Extract Project
        run: |
          mkdir -p extracted
          unzip -q ReelClone_AI_Mobile_Cloud_Build.zip -d extracted
          ls -la extracted

      - name: Install Dependencies
        working-directory: extracted/ReelClone_AI/frontend
        run: npm ci || npm install

      - name: Build Web App
        working-directory: extracted/ReelClone_AI/frontend
        run: npm run build

      - name: Setup Capacitor Android
        working-directory: extracted/ReelClone_AI/frontend
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build APK
        working-directory: extracted/ReelClone_AI/frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReelClone-AI-APK
          path: extracted/ReelClone_AI/frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
