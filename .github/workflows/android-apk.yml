name: Build ReelClone AI APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Extract Project and Detect Configuration
        id: project
        shell: bash
        run: |
          if [ ! -f "ReelClone_AI_Mobile_Cloud_Build.zip" ]; then
            echo "Error: ReelClone_AI_Mobile_Cloud_Build.zip repository root mein nahi mili."
            exit 1
          fi

          mkdir -p extracted
          unzip -q ReelClone_AI_Mobile_Cloud_Build.zip -d extracted

          if [ -f "extracted/ReelClone_AI/frontend/package.json" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE/extracted/ReelClone_AI/frontend"
          else
            CAP_CFG=$(find "$GITHUB_WORKSPACE/extracted" -maxdepth 4 -name "capacitor.config.*" -not -path "*/node_modules/*" | head -n 1)
            if [ -n "$CAP_CFG" ]; then
              PROJECT_DIR=$(dirname "$CAP_CFG")
            else
              PKG_JSON=$(find "$GITHUB_WORKSPACE/extracted" -maxdepth 4 -name "package.json" -not -path "*/node_modules/*" | head -n 1)
              if [ -z "$PKG_JSON" ]; then
                echo "Error: Extracted zip mein package.json nahi mila."
                exit 1
              fi
              PROJECT_DIR=$(dirname "$PKG_JSON")
            fi
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Detected project directory: $PROJECT_DIR"

          JAVA_VER=$(node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync(process.argv[1] + "/package.json", "utf8"));
            const deps = { ...(pkg.dependencies || {}), ...(pkg.devDependencies || {}) };
            const cap = deps["@capacitor/android"] || deps["@capacitor/core"] || "";
            const m = String(cap).match(/(\d+)/);
            const major = m ? parseInt(m[1], 10) : 7;
            console.log(major <= 6 ? "17" : "21");
          ' "$PROJECT_DIR")

          echo "java-version=$JAVA_VER" >> "$GITHUB_OUTPUT"
          echo "Selected Java version: $JAVA_VER"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ steps.project.outputs.java-version }}

      - name: Configure Preinstalled Android SDK
        shell: bash
        run: |
          set +o pipefail
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name "sdkmanager" -type f | head -n 1)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "Error: sdkmanager $ANDROID_HOME/cmdline-tools mein nahi mila."
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install Dependencies
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          if [ -f "package-lock.json" ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Build Web App
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          npm run build

            - name: Setup Capacitor Android
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f "capacitor.config.ts" ]; then
            node -e '
              const fs = require("fs");
              const raw = fs.readFileSync("capacitor.config.ts", "utf8");
              const appIdMatch = raw.match(/appId\s*:\s*["'\'']([^"'\'']+)["'\'']/);
              const appNameMatch = raw.match(/appName\s*:\s*["'\'']([^"'\'']+)["'\'']/);
              const webDirMatch = raw.match(/webDir\s*:\s*["'\'']([^"'\'']+)["'\'']/);

              const webDir = webDirMatch ? webDirMatch[1] : (fs.existsSync("dist") ? "dist" : "build");
              const cfg = {
                appId: appIdMatch ? appIdMatch[1] : "com.reelclone.ai",
                appName: appNameMatch ? appNameMatch[1] : "ReelClone AI",
                webDir: webDir
              };

              fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
              fs.unlinkSync("capacitor.config.ts");
              console.log("Converted capacitor.config.ts to capacitor.config.json:", cfg);
            '
          fi

          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          
      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          APK_FILE=$(find "$PROJECT_DIR/android/app/build/outputs/apk/debug" -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: Debug APK generate nahi hui."
            exit 1
          fi
          echo "APK_PATH=$APK_FILE" >> "$GITHUB_ENV"
          echo "Built APK: $APK_FILE"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ReelClone-AI-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          
