
name: Build ReelClone AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Project
        run: |
          mkdir extracted
          unzip -q ReelClone_AI_Mobile_Cloud_Build.zip -d extracted

      - name: Install Dependencies
        working-directory: extracted/ReelClone_AI/frontend
        run: npm install

      - name: Build Web App
        working-directory: extracted/ReelClone_AI/frontend
        run: npm run build

      - name: Create Android
        working-directory: extracted/ReelClone_AI/frontend
        run: npx cap add android

      - name: Sync Android
        working-directory: extracted/ReelClone_AI/frontend
        run: npx cap sync android

      - name: Build APK
        working-directory: extracted/ReelClone_AI/frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReelClone-AI-APK
          path: extracted/ReelClone_AI/frontend/android/app/build/outputs/apk/debug/app-debug.apk
          
